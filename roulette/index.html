<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">
<title>Рулетка — Z.LEET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#0a0d0b;
  --felt:#0e1a14;
  --felt2:#0b1410;
  --line:rgba(255,106,61,.28);
  --line-dim:rgba(255,255,255,.10);
  --acc:#ff6a3d;
  --gold:#e7b95d;
  --red:#c82e2e;
  --redL:#e6493f;
  --black:#181a1f;
  --green:#0e7a4a;
  --txt:#f3f4f8;
  --dim:#8b93a1;
  --mono:'JetBrains Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  background:radial-gradient(1100px 700px at 50% -10%, #142018 0%, #0a0d0b 55%, #050605 100%);
  color:var(--txt);
  font-family:var(--mono);
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
}
#app{
  height:var(--tg-vh, 100dvh);
  padding: calc(10px + env(safe-area-inset-top)) 10px calc(10px + env(safe-area-inset-bottom));
  display:flex;flex-direction:column;
  gap:8px;
}

#topbar{display:flex;align-items:center;justify-content:space-between;flex-shrink:0;padding:0 4px}
.brandWrap{display:flex;flex-direction:column}
.brand{font-size:10px;letter-spacing:3px;color:var(--acc);font-weight:800}
.title{font-size:10.5px;letter-spacing:2px;color:var(--dim)}
.balanceWrap{display:flex;align-items:center;gap:8px}
.balanceBox{text-align:right}
.balanceLabel{font-size:8.5px;letter-spacing:1.5px;color:var(--dim)}
.balanceVal{font-size:15px;font-weight:800;color:var(--gold)}
#resetBtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-dim);background:rgba(255,255,255,.04);color:var(--dim);font-size:14px;display:flex;align-items:center;justify-content:center}

#wheelSection{display:flex;align-items:center;justify-content:center;gap:14px;flex-shrink:0;padding:2px 0}
.wheelBox{position:relative;width:112px;height:112px;flex-shrink:0}
.wheelFace{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(255,255,255,.12), 0 0 18px rgba(0,0,0,.5)}
.wheelHub{position:absolute;left:50%;top:50%;width:26px;height:26px;background:radial-gradient(circle at 35% 30%, #3a3f4a, #101216);border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 2px rgba(255,255,255,.15)}
.ballHolder{position:absolute;inset:0;transition:transform 3.2s cubic-bezier(.12,.66,.16,1)}
.ball{position:absolute;left:50%;top:2px;width:8px;height:8px;background:#fff;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 5px rgba(255,255,255,.8)}
.wheelNumbers{position:absolute;inset:0;border-radius:50%;pointer-events:none}
.wheelNum{position:absolute;left:50%;top:50%;font-size:6px;font-weight:800;color:#fff;text-shadow:0 0 2px rgba(0,0,0,.9), 0 0 1px #000;transform-origin:0 0}

.resultBox{display:flex;flex-direction:column;align-items:flex-start;gap:3px;min-width:96px}
.resultLabel{font-size:8.5px;letter-spacing:1.5px;color:var(--dim)}
#resultNum{width:46px;height:46px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;font-weight:800;border:1px solid var(--line-dim);background:rgba(255,255,255,.03)}
#resultNum.red{background:var(--red);border-color:var(--redL);color:#fff}
#resultNum.black{background:var(--black);border-color:rgba(255,255,255,.25);color:#fff}
#resultNum.green{background:var(--green);border-color:#22c07f;color:#fff}
#resultText{font-size:9.5px;color:var(--dim);max-width:130px;line-height:1.35}

#chipRow{display:flex;gap:6px;justify-content:center;flex-shrink:0;overflow-x:auto;padding:2px 4px}
.chip{flex-shrink:0;width:40px;height:40px;border-radius:50%;border:2px dashed rgba(255,255,255,.25);background:radial-gradient(circle at 35% 30%, #23283a, #12141d);color:var(--txt);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center}
.chip.active{border:2px solid var(--gold);color:var(--gold);box-shadow:0 0 10px rgba(231,185,93,.35)}

#tableWrap{flex:1;overflow:auto;border-radius:14px;background:linear-gradient(180deg, var(--felt), var(--felt2));border:1px solid var(--line-dim);padding:8px;min-height:0}
.zeroCell{grid-column:1/14;grid-row:1;background:var(--green);border:1px solid #22c07f;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;color:#fff;position:relative}
.grid{position:relative;display:grid;grid-template-columns:repeat(12,42px) 46px;grid-template-rows:38px repeat(3,42px) 34px 34px;gap:3px;width:max-content}
.cell{border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;position:relative;color:#fff;font-size:13px}
.cell.red{background:var(--red);border:1px solid var(--redL)}
.cell.black{background:var(--black);border:1px solid rgba(255,255,255,.22)}
.cell.colbet{background:rgba(255,255,255,.05);border:1px solid var(--line-dim);color:var(--dim);font-size:9px;letter-spacing:.5px;text-align:center;line-height:1.2}
.cell.outside{background:rgba(255,255,255,.05);border:1px solid var(--line-dim);color:var(--txt);font-size:10px;letter-spacing:.5px;text-align:center;line-height:1.25;padding:2px}
.cell.outside.redtxt{color:var(--redL)}
.cell.dozen{background:rgba(255,255,255,.05);border:1px solid var(--line-dim);color:var(--dim);font-size:9.5px;letter-spacing:.5px}
.cell .badge{position:absolute;bottom:-4px;right:-4px;min-width:16px;height:16px;padding:0 3px;border-radius:999px;background:var(--gold);color:#1a1206;font-size:8.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:1px solid rgba(0,0,0,.3)}
.cell.win{outline:2px solid var(--gold);box-shadow:0 0 10px rgba(231,185,93,.6)}

#footerBar{display:flex;align-items:center;gap:8px;flex-shrink:0;padding:0 4px}
#stakeInfo{font-size:10px;color:var(--dim);flex-shrink:0}
#stakeInfo b{color:var(--txt)}
#clearBtn{flex-shrink:0;padding:12px 14px;border-radius:12px;border:1px solid var(--line-dim);background:rgba(255,255,255,.04);color:var(--dim);font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:1px}
#spinBtn{flex:1;padding:14px;border-radius:12px;border:1px solid var(--line);background:linear-gradient(180deg, rgba(255,106,61,.28), rgba(255,106,61,.10));color:var(--acc);font-family:var(--mono);font-size:13px;font-weight:800;letter-spacing:2px;box-shadow:0 0 16px rgba(255,106,61,.18)}
#spinBtn:disabled{opacity:.4}
#clearBtn:disabled{opacity:.4}

.toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%) translateY(20px);opacity:0;background:rgba(15,17,25,.95);border:1px solid var(--line);color:var(--txt);padding:12px 18px;border-radius:12px;font-size:12px;font-weight:700;letter-spacing:.5px;text-align:center;z-index:60;transition:.25s;pointer-events:none;max-width:88vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

#statsBtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line-dim);background:rgba(255,255,255,.04);color:var(--dim);font-size:12px;display:flex;align-items:center;justify-content:center}

.zone{position:absolute;z-index:6;border-radius:4px;background:rgba(231,185,93,.14);border:1px solid rgba(231,185,93,.32)}
.zone:active{background:rgba(231,185,93,.42)}
.zone.win{outline:2px solid var(--gold);box-shadow:0 0 8px rgba(231,185,93,.65);z-index:7}
.zone .badge{min-width:13px;height:13px;font-size:7px;bottom:-5px;right:-5px}

#historyStrip{display:flex;gap:5px;overflow-x:auto;flex-shrink:0;padding:2px 4px}
.histChip{flex-shrink:0;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:800;color:#fff;border:1px solid var(--line-dim)}
.histChip.red{background:var(--red);border-color:var(--redL)}
.histChip.black{background:var(--black);border-color:rgba(255,255,255,.25)}
.histChip.green{background:var(--green);border-color:#22c07f}
.histEmpty{font-size:9.5px;color:var(--dim);padding:4px 2px}

.statsOverlay{position:fixed;inset:0;background:rgba(5,6,8,.88);z-index:80;display:none;align-items:flex-end;justify-content:center}
.statsOverlay.show{display:flex}
.statsPanel{width:100%;max-width:480px;max-height:84vh;background:linear-gradient(180deg,#121712,#0a0d0b);border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:hidden}
.statsHead{display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.statsTitle{font-size:12px;letter-spacing:2px;color:var(--acc);font-weight:800}
.statsClose{width:28px;height:28px;border-radius:50%;border:1px solid var(--line-dim);background:rgba(255,255,255,.05);color:var(--dim);font-size:13px}
.statsBody{overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-bottom:6px}
.statsSectionTitle{font-size:9.5px;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px}
.statsTotal{font-size:11px;color:var(--dim)}
.statsTotal b{color:var(--gold)}
.numsGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.numCell{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:800;color:#fff;position:relative}
.numCell.red{background:rgba(200,46,46,.55)}
.numCell.black{background:rgba(24,26,31,.75);border:1px solid rgba(255,255,255,.15)}
.numCell.green{background:rgba(14,122,74,.55)}
.numCell .cnt{font-size:7.5px;font-weight:700;color:rgba(255,255,255,.85)}
.numCell.hot{outline:2px solid var(--gold);box-shadow:0 0 6px rgba(231,185,93,.5)}
.barsGrid{display:flex;flex-direction:column;gap:6px}
.barRow{display:flex;align-items:center;gap:8px;font-size:9.5px}
.barRow .barLbl{width:64px;flex-shrink:0;color:var(--dim);letter-spacing:.5px}
.barRow .barTrack{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.06);overflow:hidden}
.barRow .barFill{height:100%;background:linear-gradient(90deg,var(--acc),var(--gold))}
.barRow .barPct{width:36px;flex-shrink:0;text-align:right;color:var(--txt);font-weight:700}

.trackSection{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-dim)}
.trackTitle{font-size:9px;letter-spacing:1.5px;color:var(--dim);margin-bottom:6px}
.trackStrip{display:flex;gap:3px;overflow-x:auto;padding-bottom:8px}
.trackChip{flex-shrink:0;width:20px;height:20px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:800;color:#fff;border-bottom:3px solid transparent}
.trackChip.red{background:var(--red)}
.trackChip.black{background:var(--black)}
.trackChip.green{background:var(--green)}
.trackChip.g-voisins{border-bottom-color:var(--gold)}
.trackChip.g-tiers{border-bottom-color:#4fc3d8}
.trackChip.g-orphelins{border-bottom-color:#b985e0}
.callBtnsGrid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.callBtn{padding:9px 8px;border-radius:10px;border:1px solid var(--line-dim);background:rgba(255,255,255,.04);color:var(--txt);font-family:var(--mono);text-align:left}
.callBtn .ctitle{font-size:10px;font-weight:800;letter-spacing:.5px}
.callBtn .csub{font-size:8px;color:var(--dim);margin-top:2px}
.callBtn.voisins .ctitle{color:var(--gold)}
.callBtn.tiers .ctitle{color:#4fc3d8}
.callBtn.orphelins .ctitle{color:#b985e0}
.callBtn.zerospiel .ctitle{color:#7ee0a8}
</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brandWrap">
      <div class="brand">Z.LEET</div>
      <div class="title">РУЛЕТКА</div>
    </div>
    <div class="balanceWrap">
      <div class="balanceBox">
        <div class="balanceLabel">БАЛАНС</div>
        <div class="balanceVal" id="balanceVal">10 000</div>
      </div>
      <button id="statsBtn" type="button" title="Статистика">▤</button>
      <button id="resetBtn" type="button" title="Сбросить баланс">⟳</button>
    </div>
  </header>

  <section id="wheelSection">
    <div class="wheelBox">
      <div class="wheelFace" id="wheelFace"></div>
      <div class="wheelNumbers" id="wheelNumbers"></div>
      <div class="ballHolder" id="ballHolder"><div class="ball"></div></div>
      <div class="wheelHub"></div>
    </div>
    <div class="resultBox">
      <div class="resultLabel">ВЫПАЛО</div>
      <div id="resultNum">—</div>
      <div id="resultText">Сделайте ставку и крутите колесо</div>
    </div>
  </section>

  <div id="historyStrip"></div>

  <div id="chipRow"></div>

  <div id="tableWrap">
    <div class="grid" id="bettingGrid"></div>
  </div>

  <div id="footerBar">
    <div id="stakeInfo">СТАВКА<br><b id="stakeVal">0</b></div>
    <button id="clearBtn" type="button">ОЧИСТИТЬ</button>
    <button id="spinBtn" type="button" disabled>КРУТИТЬ</button>
  </div>
</div>
<div id="toast" class="toast"></div>
<div id="statsOverlay" class="statsOverlay">
  <div class="statsPanel">
    <div class="statsHead">
      <div class="statsTitle">СТАТИСТИКА ВЫПАДЕНИЙ</div>
      <button id="statsCloseBtn" class="statsClose" type="button">✕</button>
    </div>
    <div class="statsBody" id="statsBody"></div>
  </div>
</div>

<script>
(function(){
  var tg = window.Telegram && window.Telegram.WebApp;
  if(tg){
    try{tg.ready();}catch(e){}
    try{tg.expand();}catch(e){}
    try{tg.requestFullscreen && tg.requestFullscreen();}catch(e){}
    try{tg.disableVerticalSwipes && tg.disableVerticalSwipes();}catch(e){}
    try{tg.setHeaderColor && tg.setHeaderColor('#0a0d0b');}catch(e){}
    try{tg.setBackgroundColor && tg.setBackgroundColor('#0a0d0b');}catch(e){}
    try{tg.setBottomBarColor && tg.setBottomBarColor('#0a0d0b');}catch(e){}
  }

  // The app's height must match the ACTUAL usable viewport (not just 100dvh, which can
  // misbehave inside Telegram's WebView / older browsers), so the layout never grows
  // taller than the screen and gets clipped. Telegram reports its own stable viewport
  // height that accounts for its chrome; fall back to window.innerHeight elsewhere.
  function applyViewportHeight(){
    var h = (tg && tg.viewportStableHeight) ? tg.viewportStableHeight : (window.innerHeight || document.documentElement.clientHeight);
    if(h) document.documentElement.style.setProperty('--tg-vh', h + 'px');
  }
  applyViewportHeight();
  if(tg){
    try{ tg.onEvent && tg.onEvent('viewportChanged', applyViewportHeight); }catch(e){}
  }
  window.addEventListener('resize', applyViewportHeight);
  window.addEventListener('orientationchange', applyViewportHeight);
  function haptic(type){
    if(!tg || !tg.HapticFeedback) return;
    try{
      if(type==='light'||type==='medium'||type==='heavy') tg.HapticFeedback.impactOccurred(type);
      else if(type==='success'||type==='error'||type==='warning') tg.HapticFeedback.notificationOccurred(type);
      else if(type==='selection') tg.HapticFeedback.selectionChanged();
    }catch(e){}
  }
  var audioCtx = null;
  function playTone(freq, dur, type, vol){
    try{
      audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
      var o = audioCtx.createOscillator(); var g = audioCtx.createGain();
      o.type = type; o.frequency.value = freq; g.gain.value = vol;
      o.connect(g); g.connect(audioCtx.destination);
      o.start();
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.stop(audioCtx.currentTime + dur);
    }catch(e){}
  }

  var WHEEL_ORDER = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  var RED_SET = new Set([1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36]);
  var SEG = 360/37;

  function colorOf(n){ if(n===0) return 'green'; return RED_SET.has(n) ? 'red' : 'black'; }

  // build wheel face conic-gradient + number labels
  var wheelFace = document.getElementById('wheelFace');
  var grad = [];
  WHEEL_ORDER.forEach(function(n, i){
    var col = colorOf(n) === 'red' ? '#c82e2e' : (colorOf(n)==='green' ? '#0e7a4a' : '#181a1f');
    grad.push(col + ' ' + (i*SEG).toFixed(3) + 'deg ' + ((i+1)*SEG).toFixed(3) + 'deg');
  });
  wheelFace.style.background = 'conic-gradient(from 0deg, ' + grad.join(', ') + ')';

  // number labels around the wheel face, positioned at each segment's center angle
  var wheelNumbers = document.getElementById('wheelNumbers');
  var WHEEL_LABEL_RADIUS = 44;
  WHEEL_ORDER.forEach(function(n, i){
    var angle = i*SEG + SEG/2;
    var lbl = document.createElement('div');
    lbl.className = 'wheelNum';
    lbl.textContent = n;
    lbl.style.transform = 'translate(-50%,-50%) rotate(' + angle.toFixed(2) + 'deg) translateY(-' + WHEEL_LABEL_RADIUS + 'px) rotate(-' + angle.toFixed(2) + 'deg)';
    wheelNumbers.appendChild(lbl);
  });

  var ballHolder = document.getElementById('ballHolder');
  var wheelRotation = 0;

  function angleForNumber(n){
    var idx = WHEEL_ORDER.indexOf(n);
    return idx*SEG + SEG/2;
  }
  function spinBallTo(n, cb){
    var target = angleForNumber(n);
    var curMod = ((wheelRotation % 360) + 360) % 360;
    var delta = ((target - curMod) + 360) % 360;
    var spins = 6;
    wheelRotation += spins*360 + delta;
    ballHolder.style.transform = 'rotate(' + wheelRotation + 'deg)';
    setTimeout(cb, 3300);
  }

  // betting grid build
  var bettingGrid = document.getElementById('bettingGrid');
  var bets = {}; // key -> amount
  var STARTING_BALANCE = 10000;
  var BALANCE_KEY = 'zleet_roulette_balance';
  var balance = STARTING_BALANCE;
  try{
    var savedBalance = localStorage.getItem(BALANCE_KEY);
    if(savedBalance !== null){
      var parsed = parseInt(savedBalance, 10);
      if(!isNaN(parsed) && parsed >= 0) balance = parsed;
    }
  }catch(e){}
  var currentChip = 25;
  var spinning = false;

  function addCell(el){ bettingGrid.appendChild(el); return el; }

  // zero
  var zero = document.createElement('div');
  zero.className = 'zeroCell';
  zero.dataset.key = 'num-0';
  zero.textContent = '0';
  addCell(zero);

  // numbers 1-36
  for(var n=1;n<=36;n++){
    var col = Math.ceil(n/3);
    var mod = n%3;
    var row = mod===0 ? 2 : (mod===2 ? 3 : 4); // row2=top(mult of3), row3=mid, row4=bottom ; rows shifted by +1 (row1=zero)
    var cell = document.createElement('div');
    cell.className = 'cell ' + (RED_SET.has(n)?'red':'black');
    cell.style.gridColumn = col;
    cell.style.gridRow = row;
    cell.dataset.key = 'num-'+n;
    cell.textContent = n;
    addCell(cell);
  }

  // column bets (2 to 1) at col13, rows 2-4
  var colBetDefs = [
    {row:2, key:'col3', label:'2:1'}, // top row -> multiples of 3
    {row:3, key:'col2', label:'2:1'}, // mid row
    {row:4, key:'col1', label:'2:1'}  // bottom row
  ];
  colBetDefs.forEach(function(d){
    var c = document.createElement('div');
    c.className = 'cell colbet';
    c.style.gridColumn = 13;
    c.style.gridRow = d.row;
    c.dataset.key = d.key;
    c.textContent = d.label;
    addCell(c);
  });

  // dozens row5
  var dozenDefs = [
    {key:'dozen1', label:'1-12', cols:'1 / 5'},
    {key:'dozen2', label:'13-24', cols:'5 / 9'},
    {key:'dozen3', label:'25-36', cols:'9 / 13'}
  ];
  dozenDefs.forEach(function(d){
    var c = document.createElement('div');
    c.className = 'cell dozen';
    c.style.gridColumn = d.cols;
    c.style.gridRow = 5;
    c.dataset.key = d.key;
    c.textContent = d.label;
    addCell(c);
  });

  // even-money row6
  var outsideDefs = [
    {key:'low', label:'1-18', cols:'1 / 3', red:false},
    {key:'even', label:'ЧЁТ', cols:'3 / 5', red:false},
    {key:'red', label:'КРАСНОЕ', cols:'5 / 7', red:true},
    {key:'black', label:'ЧЁРНОЕ', cols:'7 / 9', red:false},
    {key:'odd', label:'НЕЧЕТ', cols:'9 / 11', red:false},
    {key:'high', label:'19-36', cols:'11 / 13', red:false}
  ];
  outsideDefs.forEach(function(d){
    var c = document.createElement('div');
    c.className = 'cell outside' + (d.red?' redtxt':'');
    c.style.gridColumn = d.cols;
    c.style.gridRow = 6;
    c.dataset.key = d.key;
    c.textContent = d.label;
    addCell(c);
  });

  // --- inside bets: split / street / corner / six line ---
  // pixel geometry must mirror .grid CSS: columns 42px x12 + 46px, rows 38/42/42/42/34/34, gap 3px
  var ROWTOP = [0, 0, 41, 86, 131, 176, 213]; // index by row 1..6
  var ROWH   = [0, 38, 42, 42, 42, 34, 34];
  function colLeft(c){ return 45*(c-1); }
  function colWidth(c){ return c===13 ? 46 : 42; }
  function colBoundary(c){ return colLeft(c+1) - 1.5; } // gap-center after column c
  function rowBoundary(r){ return ROWTOP[r+1] - 1.5; } // gap-center after row r

  var INSIDE_BETS = {}; // key -> {nums:[...], payout:Number}
  var insideBetKeys = [];

  function keyFromNums(prefix, nums){
    var sorted = nums.slice().sort(function(a,b){return a-b;});
    return prefix + '-' + sorted.join('-');
  }
  // registers a bet combination for win/payout lookup, without necessarily creating a felt hit-zone
  // (used both by addZone below, and directly for zero-adjacent combos needed only by the track/call bets)
  function registerInsideBet(prefix, nums, payout){
    var key = keyFromNums(prefix, nums);
    INSIDE_BETS[key] = { nums: nums.slice(), payout: payout };
    insideBetKeys.push(key);
    return key;
  }
  function addZone(prefix, nums, payout, x, y, w, h){
    var key = registerInsideBet(prefix, nums, payout);
    var z = document.createElement('div');
    z.className = 'zone';
    z.dataset.key = key;
    z.style.left = x.toFixed(1) + 'px';
    z.style.top = y.toFixed(1) + 'px';
    z.style.width = w + 'px';
    z.style.height = h + 'px';
    addCell(z);
  }

  var SPLIT_PAYOUT = 18, STREET_PAYOUT = 12, CORNER_PAYOUT = 9, SIXLINE_PAYOUT = 6;

  // number at (colGroup g, row r) where r: 2=top(mult of 3), 3=mid, 4=bottom
  function numAt(g, r){ return r===2 ? 3*g : (r===3 ? 3*g-1 : 3*g-2); }

  // horizontal splits (adjacent columns, same row) for rows 2,3,4 ; g=1..11
  for(var rr=2; rr<=4; rr++){
    for(var g=1; g<=11; g++){
      var a = numAt(g, rr), b = numAt(g+1, rr);
      addZone('split', [a,b], SPLIT_PAYOUT,
        colBoundary(g)-7, ROWTOP[rr]+4, 14, ROWH[rr]-8);
    }
  }
  // vertical splits (adjacent rows, same column) : row2/row3 and row3/row4 ; g=1..12
  for(var g2=1; g2<=12; g2++){
    var top2 = numAt(g2,2), mid2 = numAt(g2,3), bot2 = numAt(g2,4);
    addZone('split', [top2,mid2], SPLIT_PAYOUT, colLeft(g2)+4, rowBoundary(2)-7, colWidth(g2)-8, 14);
    addZone('split', [mid2,bot2], SPLIT_PAYOUT, colLeft(g2)+4, rowBoundary(3)-7, colWidth(g2)-8, 14);
  }
  // streets (column of 3) ; g=1..12
  for(var g3=1; g3<=12; g3++){
    var nums3 = [numAt(g3,2), numAt(g3,3), numAt(g3,4)];
    addZone('street', nums3, STREET_PAYOUT, colLeft(g3)+4, rowBoundary(4)-7, colWidth(g3)-8, 14);
  }
  // six lines (two adjacent streets) ; g=1..11
  for(var g4=1; g4<=11; g4++){
    var nums6 = [numAt(g4,2),numAt(g4,3),numAt(g4,4), numAt(g4+1,2),numAt(g4+1,3),numAt(g4+1,4)];
    addZone('sixline', nums6, SIXLINE_PAYOUT, colBoundary(g4)-7, rowBoundary(4)-7, 14, 14);
  }
  // corners (4 numbers meeting at an intersection) ; g=1..11, two row-boundaries
  for(var g5=1; g5<=11; g5++){
    var cA = [numAt(g5,3), numAt(g5,4), numAt(g5+1,3), numAt(g5+1,4)]; // row3/row4 boundary
    addZone('corner', cA, CORNER_PAYOUT, colBoundary(g5)-7, rowBoundary(3)-7, 14, 14);
    var cB = [numAt(g5,2), numAt(g5,3), numAt(g5+1,2), numAt(g5+1,3)]; // row2/row3 boundary
    addZone('corner', cB, CORNER_PAYOUT, colBoundary(g5)-7, rowBoundary(2)-7, 14, 14);
  }

  // zero-adjacent combos have no felt hit-zone (zero cell spans the whole top row),
  // but are needed for the "устные ставки" (announced/call) track bets below
  registerInsideBet('trio', [0,2,3], STREET_PAYOUT); // 0/2/3 trio, same payout as a street (11:1)
  registerInsideBet('split', [0,3], SPLIT_PAYOUT);

  // --- track (racetrack) call bets: Voisins du Zéro, Tiers du Cylindre, Orphelins, Zero Spiel ---
  var VOISINS_NUMS = [22,18,29,7,28,12,35,3,26,0,32,15,19,4,21,2,25];
  var ORPHELINS_NUMS = [1,20,14,31,9,17,34,6];
  var TIERS_NUMS = [27,13,36,11,30,8,23,10,5,24,16,33];

  var CALL_BETS = {
    voisins: { label:'Соседи 0', units:[
      {key:'trio-0-2-3', count:2},
      {key:'split-4-7', count:1},
      {key:'split-12-15', count:1},
      {key:'split-18-21', count:1},
      {key:'split-19-22', count:1},
      {key:'corner-25-26-28-29', count:2},
      {key:'split-32-35', count:1}
    ]},
    tiers: { label:'Тьер', units:[
      {key:'split-5-8', count:1},
      {key:'split-10-11', count:1},
      {key:'split-13-16', count:1},
      {key:'split-23-24', count:1},
      {key:'split-27-30', count:1},
      {key:'split-33-36', count:1}
    ]},
    orphelins: { label:'Сироты', units:[
      {key:'num-1', count:1},
      {key:'split-6-9', count:1},
      {key:'split-14-17', count:1},
      {key:'split-17-20', count:1},
      {key:'split-31-34', count:1}
    ]},
    zerospiel: { label:'Зеро игра', units:[
      {key:'split-0-3', count:1},
      {key:'split-12-15', count:1},
      {key:'num-26', count:1},
      {key:'split-32-35', count:1}
    ]}
  };

  // chip selector
  var chipRow = document.getElementById('chipRow');
  var CHIP_VALUES = [10,25,50,100,500,1000];
  CHIP_VALUES.forEach(function(v){
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (v===currentChip ? ' active' : '');
    b.textContent = v>=1000 ? (v/1000)+'K' : v;
    b.dataset.val = v;
    b.onclick = function(){
      currentChip = parseInt(this.dataset.val,10);
      Array.prototype.forEach.call(chipRow.querySelectorAll('.chip'), function(x){ x.classList.remove('active'); });
      this.classList.add('active');
      haptic('selection');
    };
    chipRow.appendChild(b);
  });

  function fmt(v){ return v.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }
  function updateBalanceUI(){
    document.getElementById('balanceVal').textContent = fmt(balance);
    try{ localStorage.setItem(BALANCE_KEY, String(balance)); }catch(e){}
  }
  function totalStake(){ return Object.keys(bets).reduce(function(s,k){ return s+bets[k]; }, 0); }
  function updateStakeUI(){
    var t = totalStake();
    document.getElementById('stakeVal').textContent = fmt(t);
    document.getElementById('spinBtn').disabled = spinning || t<=0;
    document.getElementById('clearBtn').disabled = spinning || t<=0;
  }
  updateBalanceUI();
  updateStakeUI();

  function cellByKey(key){ return bettingGrid.querySelector('[data-key="'+key+'"]'); }

  function placeBet(key){
    if(spinning) return;
    if(balance < currentChip){ haptic('warning'); showToast('Недостаточно фишек'); return; }
    balance -= currentChip;
    bets[key] = (bets[key]||0) + currentChip;
    updateBalanceUI();
    renderBadge(key);
    updateStakeUI();
    haptic('light');
    playTone(700,.05,'square',.08);
  }

  function renderBadge(key){
    var cell = cellByKey(key);
    if(!cell) return;
    var badge = cell.querySelector('.badge');
    if(!badge){
      badge = document.createElement('div');
      badge.className = 'badge';
      cell.appendChild(badge);
    }
    badge.textContent = bets[key]>=1000 ? (bets[key]/1000)+'K' : bets[key];
  }

  bettingGrid.addEventListener('click', function(ev){
    var cell = ev.target.closest('[data-key]');
    if(!cell) return;
    placeBet(cell.dataset.key);
  });

  function placeCallBet(callKey){
    if(spinning) return;
    var def = CALL_BETS[callKey];
    if(!def) return;
    var totalUnits = def.units.reduce(function(s,u){ return s+u.count; }, 0);
    var cost = totalUnits*currentChip;
    if(balance < cost){ haptic('warning'); showToast('Недостаточно фишек'); return; }
    balance -= cost;
    def.units.forEach(function(u){
      bets[u.key] = (bets[u.key]||0) + currentChip*u.count;
      renderBadge(u.key);
    });
    updateBalanceUI();
    updateStakeUI();
    haptic('medium');
    playTone(700,.05,'square',.08);
    showToast(def.label + ': ' + fmt(cost) + ' фишек (' + totalUnits + ' юнитов)');
  }

  // --- track (racetrack) UI: wheel-order number strip + call-bet buttons ---
  var trackWrap = document.createElement('div');
  trackWrap.className = 'trackSection';
  trackWrap.innerHTML = '<div class="trackTitle">УСТНЫЕ СТАВКИ ПО ТРЕКУ</div><div class="trackStrip" id="trackStrip"></div><div class="callBtnsGrid" id="callBtnsGrid"></div>';
  document.getElementById('tableWrap').appendChild(trackWrap);

  var VOISINS_SET = new Set(VOISINS_NUMS), TIERS_SET = new Set(TIERS_NUMS), ORPHELINS_SET = new Set(ORPHELINS_NUMS);
  function trackGroupOf(n){
    if(VOISINS_SET.has(n)) return 'g-voisins';
    if(TIERS_SET.has(n)) return 'g-tiers';
    if(ORPHELINS_SET.has(n)) return 'g-orphelins';
    return '';
  }
  var trackStrip = document.getElementById('trackStrip');
  WHEEL_ORDER.forEach(function(n){
    var c = document.createElement('div');
    c.className = 'trackChip ' + colorOf(n) + ' ' + trackGroupOf(n);
    c.textContent = n;
    trackStrip.appendChild(c);
  });

  var callBtnsGrid = document.getElementById('callBtnsGrid');
  [
    {key:'voisins', cls:'voisins'},
    {key:'tiers', cls:'tiers'},
    {key:'orphelins', cls:'orphelins'},
    {key:'zerospiel', cls:'zerospiel'}
  ].forEach(function(d){
    var def = CALL_BETS[d.key];
    var units = def.units.reduce(function(s,u){ return s+u.count; }, 0);
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'callBtn ' + d.cls;
    b.innerHTML = '<div class="ctitle">' + def.label + '</div><div class="csub">' + units + ' юнитов × фишка</div>';
    b.onclick = function(){ placeCallBet(d.key); };
    callBtnsGrid.appendChild(b);
  });

  document.getElementById('clearBtn').onclick = function(){
    if(spinning) return;
    var refund = totalStake();
    balance += refund;
    bets = {};
    Array.prototype.forEach.call(bettingGrid.querySelectorAll('.badge'), function(b){ b.remove(); });
    Array.prototype.forEach.call(bettingGrid.querySelectorAll('.win'), function(c){ c.classList.remove('win'); });
    updateBalanceUI();
    updateStakeUI();
    haptic('light');
  };

  document.getElementById('resetBtn').onclick = function(){
    if(spinning) return;
    var refund = totalStake();
    bets = {};
    Array.prototype.forEach.call(bettingGrid.querySelectorAll('.badge'), function(b){ b.remove(); });
    balance = STARTING_BALANCE;
    updateBalanceUI();
    updateStakeUI();
    haptic('warning');
    showToast('Баланс сброшен до ' + fmt(STARTING_BALANCE));
  };

  var toastTimer = null;
  function showToast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2600);
  }

  function betWinKeysFor(n){
    var keys = ['num-'+n];
    if(n===0){
      // zero can still be part of inside bets that include it (none defined currently, but keep loop for future-proofing)
      insideBetKeys.forEach(function(k){ if(INSIDE_BETS[k].nums.indexOf(n)!==-1) keys.push(k); });
      return keys;
    }
    keys.push(colorOf(n));
    keys.push(n%2===0 ? 'even' : 'odd');
    keys.push(n<=18 ? 'low' : 'high');
    keys.push(n<=12 ? 'dozen1' : (n<=24 ? 'dozen2' : 'dozen3'));
    var mod = n%3;
    keys.push(mod===1 ? 'col1' : (mod===2 ? 'col2' : 'col3'));
    insideBetKeys.forEach(function(k){ if(INSIDE_BETS[k].nums.indexOf(n)!==-1) keys.push(k); });
    return keys;
  }
  var PAYOUT = { num:36, color:2, evenodd:2, lowhigh:2, dozen:3, col:3 };
  function payoutMultiplierFor(key){
    if(INSIDE_BETS[key]) return INSIDE_BETS[key].payout;
    if(key.indexOf('num-')===0) return PAYOUT.num;
    if(key==='red'||key==='black') return PAYOUT.color;
    if(key==='even'||key==='odd') return PAYOUT.evenodd;
    if(key==='low'||key==='high') return PAYOUT.lowhigh;
    if(key.indexOf('dozen')===0) return PAYOUT.dozen;
    if(key.indexOf('col')===0) return PAYOUT.col;
    return 0;
  }

  document.getElementById('spinBtn').onclick = function(){
    if(spinning || totalStake()<=0) return;
    spinning = true;
    updateStakeUI();
    document.getElementById('resultText').textContent = 'Колесо крутится...';
    document.getElementById('resultNum').textContent = '•';
    document.getElementById('resultNum').className = '';
    haptic('medium');
    Array.prototype.forEach.call(bettingGrid.querySelectorAll('.win'), function(c){ c.classList.remove('win'); });

    var winningNumber = Math.floor(Math.random()*37);
    spinBallTo(winningNumber, function(){
      resolveRound(winningNumber);
    });
  };

  // --- history / statistics ---
  var spinHistory = []; // array of numbers, newest first
  var historyStrip = document.getElementById('historyStrip');
  function updateHistoryUI(){
    if(spinHistory.length===0){
      historyStrip.innerHTML = '<div class="histEmpty">История пуста — сделайте первый спин</div>';
      return;
    }
    var html = '';
    spinHistory.slice(0, 25).forEach(function(n){
      html += '<div class="histChip ' + colorOf(n) + '">' + n + '</div>';
    });
    historyStrip.innerHTML = html;
  }
  updateHistoryUI();

  function buildStatsHTML(){
    var total = spinHistory.length;
    if(total===0){
      return '<div class="statsTotal">Пока нет данных — сделайте хотя бы один спин.</div>';
    }
    var counts = {};
    for(var i=0;i<=36;i++) counts[i]=0;
    var redC=0, blackC=0, greenC=0, evenC=0, oddC=0, lowC=0, highC=0, dz1=0, dz2=0, dz3=0;
    spinHistory.forEach(function(n){
      counts[n]++;
      if(n===0){ greenC++; return; }
      if(colorOf(n)==='red') redC++; else blackC++;
      if(n%2===0) evenC++; else oddC++;
      if(n<=18) lowC++; else highC++;
      if(n<=12) dz1++; else if(n<=24) dz2++; else dz3++;
    });
    var maxCount = 0;
    for(var k=0;k<=36;k++){ if(counts[k]>maxCount) maxCount = counts[k]; }

    var numsHtml = '';
    for(var num=0; num<=36; num++){
      var c = counts[num];
      var isHot = maxCount>0 && c===maxCount && c>0;
      numsHtml += '<div class="numCell ' + colorOf(num) + (isHot?' hot':'') + '">' + num + '<span class="cnt">' + c + '</span></div>';
    }

    function pct(v){ return total>0 ? Math.round(v/total*100) : 0; }
    function barRow(label, value){
      var p = pct(value);
      return '<div class="barRow"><div class="barLbl">' + label + '</div><div class="barTrack"><div class="barFill" style="width:' + p + '%"></div></div><div class="barPct">' + value + ' (' + p + '%)</div></div>';
    }

    var barsHtml = barRow('КРАСНОЕ', redC) + barRow('ЧЁРНОЕ', blackC) + barRow('ЗЕРО', greenC)
      + barRow('ЧЁТ', evenC) + barRow('НЕЧЕТ', oddC)
      + barRow('1-18', lowC) + barRow('19-36', highC)
      + barRow('1-12', dz1) + barRow('13-24', dz2) + barRow('25-36', dz3);

    return '<div class="statsTotal">Всего спинов: <b>' + total + '</b></div>'
      + '<div><div class="statsSectionTitle">ЧАСТОТА ЧИСЕЛ</div><div class="numsGrid">' + numsHtml + '</div></div>'
      + '<div><div class="statsSectionTitle">ВНЕШНИЕ СТАВКИ</div><div class="barsGrid">' + barsHtml + '</div></div>';
  }

  var statsOverlay = document.getElementById('statsOverlay');
  document.getElementById('statsBtn').onclick = function(){
    document.getElementById('statsBody').innerHTML = buildStatsHTML();
    statsOverlay.classList.add('show');
    haptic('light');
  };
  document.getElementById('statsCloseBtn').onclick = function(){
    statsOverlay.classList.remove('show');
    haptic('light');
  };
  statsOverlay.addEventListener('click', function(ev){
    if(ev.target === statsOverlay) statsOverlay.classList.remove('show');
  });

  function resolveRound(n){
    var col = colorOf(n);
    var rn = document.getElementById('resultNum');
    rn.textContent = n;
    rn.className = col;

    spinHistory.unshift(n);
    updateHistoryUI();

    var winKeys = betWinKeysFor(n);
    var totalReturn = 0;
    var placedKeys = Object.keys(bets);
    placedKeys.forEach(function(key){
      if(winKeys.indexOf(key) !== -1){
        var mult = payoutMultiplierFor(key);
        totalReturn += bets[key]*mult;
        var c = cellByKey(key);
        if(c) c.classList.add('win');
      }
    });

    balance += totalReturn;

    if(totalReturn>0){
      haptic('success');
      playTone(660,.12,'triangle',.16);
      setTimeout(function(){ playTone(880,.16,'triangle',.14); }, 110);
      document.getElementById('resultText').textContent = n + ' (' + (col==='red'?'красное':col==='black'?'чёрное':'зеро') + ') — выплата ' + fmt(totalReturn);
      showToast('Выигрыш: ' + fmt(totalReturn) + ' фишек');
    } else {
      haptic('error');
      playTone(140,.3,'sawtooth',.18);
      document.getElementById('resultText').textContent = n + ' (' + (col==='red'?'красное':col==='black'?'чёрное':'зеро') + ') — не повезло';
      showToast('Ставки не сыграли');
    }

    updateBalanceUI();

    setTimeout(function(){
      bets = {};
      Array.prototype.forEach.call(bettingGrid.querySelectorAll('.badge'), function(b){ b.remove(); });
      spinning = false;
      updateStakeUI();
    }, 1800);
  }
})();
</script>
</body>
</html>
